name: Run Rental Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 6am UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python rental_scraper_agent.py --csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: riyadh-rentals-${{ github.run_number }}
          path: |
            riyadh_studio_rentals_*.xlsx
            riyadh_studio_rentals_*.csv
          retention-days: 30

      - name: Summary
        run: |
          echo "## Scraping Results" >> $GITHUB_STEP_SUMMARY
          for f in riyadh_studio_rentals_*.xlsx; do
            echo "✅ $f" >> $GITHUB_STEP_SUMMARY
          done
          echo "Download from **Artifacts** below." >> $GITHUB_STEP_SUMMARY
